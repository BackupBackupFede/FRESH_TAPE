name: Fresh Tape

on:
  workflow_dispatch:          # lancement manuel : bouton "Run workflow" (aussi dans l'appli GitHub mobile)

permissions:
  contents: write             # commit du rapport

jobs:
  freshtape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Fresh Tape
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python freshtape.py

      - name: Commit du rapport
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A                     # output/ est exclu par .gitignore
          if git diff --staged --quiet; then
            echo "Rien à committer"
          else
            git commit -m "freshtape: $(date -u +%Y-%m-%d)"
            git push
          fi
